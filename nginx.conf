# Template: o entrypoint da imagem troca ${KRLOC_UPSTREAM} pelo ambiente no boot.
# As variaveis do proprio nginx ($uri, $host, $csp_policy) nao sao tocadas.

server {
  listen       8080;
  server_name  _;

  # A versao no cabecalho `Server` so serve a quem procura alvo por versao.
  server_tokens off;

  root  /usr/share/nginx/html;
  index index.html;

  # ⚠️ `add_header` num location DESCARTA os herdados do server. Todo location
  # que declara o proprio header repete os de seguranca, senao o index.html
  # sairia sem protecao contra ser embutido.

  # A politica de conteudo, escrita uma vez e repetida onde for preciso.
  #
  # `script-src 'self'` vale porque o build nao gera script inline: o index.html
  # so referencia os bundles de /assets. `style-src` precisa de 'unsafe-inline'
  # porque o Vuetify escreve estilo no proprio elemento, e `connect-src` inclui
  # a base de CEP, a unica chamada que sai desta origem.
  set $csp_policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://viacep.com.br";

  # Endpoint de health para o compose e para o Cloud Run.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # A API do KRLoc na mesma origem do front, como o proxy do Vite faz em
  # desenvolvimento. Sem ${KRLOC_UPSTREAM}, responde 404: em producao o rewrite
  # do hosting manda /api ao servico da API antes de chegar aqui.
  location /api/ {
    set $krloc_upstream "${KRLOC_UPSTREAM}";

    if ($krloc_upstream = "") {
      return 404;
    }

    # O upload de planilha aceita ate 2 MB no backend. O padrao do nginx e 1 MB,
    # e a recusa viria daqui, com um 413 que a API nunca veria.
    client_max_body_size 3m;

    # DNS do Docker, resolvido por requisicao: o nginx sobe mesmo antes da API.
    resolver 127.0.0.11 valid=30s ipv6=off;

    proxy_pass $krloc_upstream;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Assets com hash no nome podem ser cacheados de forma agressiva.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $csp_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    try_files $uri =404;
  }

  # O index nunca pode ser cacheado, senao o deploy novo nao chega ao usuario.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $csp_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  }

  # SPA: qualquer rota desconhecida cai no index e o vue-router resolve.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # A tela de gestao nao e embutivel em pagina de terceiro.
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy $csp_policy always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
}
